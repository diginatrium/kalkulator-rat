<p-toast />

<div class="page-container">
  <header class="page-header print-only-block">
    <h1>Kalkulator rat kredytowych</h1>
    <p class="subtitle">Oblicz harmonogram spłaty i sprawdź wpływ nadpłat na Twój kredyt</p>
  </header>

  <app-toolbar
    class="no-print"
    [exportingPdf]="exportingPdf()"
    [formInvalid]="isFormInvalid()"
    [shareUrl]="shareUrl()"
    (openSaveDialog)="openSaveDialog()"
    (exportPdf)="exportPdf()"
    (exportCsv)="exportCsv()"
  />

  <div class="main-grid">
    <aside class="forms-column no-print">
      <app-loan-form [loanInput]="loanInput()" (loanInputChange)="loanInput.set($event)" />

      <app-overpayments-form
        [overpayments]="overpayments()"
        (overpaymentsChange)="overpayments.set($event)"
      />

      <app-rate-changes-form
        [rateChanges]="rateChanges()"
        (rateChangesChange)="rateChanges.set($event)"
      />

      <app-budget-form
        [budget]="budget()"
        (budgetChange)="budget.set($event)"
        [averageMonthlyPayment]="comparison().planA.result.averageMonthlyPayment"
      />
    </aside>

    <section class="results-column">
      <app-three-column-summary
        [comparison]="comparison()"
        [inflationEnabled]="loanInput().inflationEnabled"
      />

      <app-balance-chart class="no-print" [comparison]="comparison()" />

      <app-structure-chart class="no-print" [result]="comparison().planA.result" />

      <app-what-if-table class="no-print" [loanInput]="loanInput()" />
    </section>
  </div>

  <app-schedule-table
    [comparison]="comparison()"
    [inflationEnabled]="loanInput().inflationEnabled"
  />
</div>

<app-save-scenario-dialog
  [visible]="saveDialogVisible()"
  (visibleChange)="saveDialogVisible.set($event)"
  [currentState]="appState()"
  (loadScenario)="applyState($event)"
/>
